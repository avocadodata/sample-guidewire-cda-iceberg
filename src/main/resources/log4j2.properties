# Console-only configuration. Pure log4j 2 (no log4j 1.x references).
# EMR Serverless overrides this via -Dlog4j.configurationFile when running on
# the cluster, so this only takes effect for local runs and tests. The
# important property is that the classpath contains a *valid* log4j2 config
# — a broken one suppresses our application loggers entirely (we hit this in
# OSR; preserved here as a known-good baseline).

rootLogger.level = INFO
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

appender.console.name = STDOUT
appender.console.type = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
